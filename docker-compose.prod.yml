services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    volumes:
      - taskflow_prod_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: taskflow-prod-redis
    restart: unless-stopped
    volumes:
      - taskflow_prod_redis:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: taskflow-prod-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.production
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: taskflow-prod-web
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: taskflow-prod-nginx
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  taskflow_prod_pg:
  taskflow_prod_redis:

