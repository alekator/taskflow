services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: taskflow-prod-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    depends_on:
      - api
      - alertmanager
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - taskflow_prod_prometheus:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: taskflow-prod-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - taskflow_prod_alertmanager:/alertmanager

  grafana:
    image: grafana/grafana:11.3.0
    container_name: taskflow-prod-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3005:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - taskflow_prod_grafana:/var/lib/grafana

volumes:
  taskflow_prod_prometheus:
  taskflow_prod_alertmanager:
  taskflow_prod_grafana:
