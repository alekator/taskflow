services:
  - type: web
    name: taskflow-api
    env: docker
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://taskflow-web.onrender.com
      - key: INVITE_EMAIL_PROVIDER
        value: simulated

  - type: web
    name: taskflow-web
    env: docker
    dockerfilePath: apps/web/Dockerfile
    dockerCommand: pnpm --filter web start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://taskflow-api.onrender.com/api

databases:
  - name: taskflow-postgres
    plan: free
