global:
  resolve_timeout: 5m

route:
  receiver: taskflow-default
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: taskflow-critical

receivers:
  - name: taskflow-default
  - name: taskflow-critical
